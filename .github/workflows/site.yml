name: site

# Раз на тиждень забирає свіжі файли з data.gov.ua і перезбирає сторінку пошуку.
on:
  schedule:
    - cron: '17 5 * * 1'
  push:
    branches: [main]
    paths: ['src/**', 'site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # поки що тільки записує, куди ходить runner; список доменів для блокування складемо з цих журналів
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.0.x'
      # серед тестів є звірка хешів CSP: зі старим хешем сторінка не запустила б свій скрипт
      - name: Test
        run: dotnet test -c Release
      - name: Import registers
        working-directory: src/Energoreestr
        run: dotnet run -c Release -- import
      - name: Export data for the page
        working-directory: src/Energoreestr
        run: dotnet run -c Release --no-build -- export ../../site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # id-token видаємо тільки тут: у build виконується наш код над чужими файлами,
    # а тут лише підпис і викладка вже зібраного архіву
    permissions:
      pages: write
      id-token: write
      attestations: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      # підписуємо файли з того самого архіву, який піде на Pages, а не з окремої збірки
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages
      - name: Unpack the page
        run: |
          mkdir "$RUNNER_TEMP/site"
          tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C "$RUNNER_TEMP/site"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/site/data.json
            ${{ runner.temp }}/site/index.html
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
